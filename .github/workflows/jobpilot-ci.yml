name: JobPilot CI/CD

on:
  push:
    paths:
      - "JobPilot/**"
      - ".github/workflows/jobpilot-ci.yml"
  pull_request:
    paths:
      - "JobPilot/**"
      - ".github/workflows/jobpilot-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            JobPilot/frontend/package-lock.json
            JobPilot/backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: JobPilot/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: JobPilot/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: JobPilot/frontend
        env:
          VITE_API_URL: http://localhost:3001/api
          VITE_DEMO_MODE: "true"
        run: npm run build

      - name: Install backend dependencies
        working-directory: JobPilot/backend
        run: npm ci

      - name: Backend syntax check
        working-directory: JobPilot/backend
        run: |
          node --check server.js
          node --check authController.js
          node --check authMiddleware.js
          node --check database.js
          node --check migrate.js

  docker:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./JobPilot/frontend
          file: ./JobPilot/frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobpilot-frontend:latest
            ghcr.io/${{ github.repository_owner }}/jobpilot-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=http://localhost:3001/api
            VITE_DEMO_MODE=true

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./JobPilot/backend
          file: ./JobPilot/backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobpilot-backend:latest
            ghcr.io/${{ github.repository_owner }}/jobpilot-backend:${{ github.sha }}
